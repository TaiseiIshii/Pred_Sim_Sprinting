name: pred_sim_sprinting
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - numpy=1.21.6
  - pandas=1.3.5
  - matplotlib=3.4.3
  - scipy=1.7.3
  - pytest=6.2.5
  - ipython=7.25.0
  - jupyter=1.0.0
  - pip
  - pip:
    - casadi==3.5.5

variables:
  CASADI_MATLAB_VERSION: "3.3.0"
  CASADI_PATH: "${CONDA_PREFIX}/lib/python3.9/site-packages/casadi"
