name: Deploy thesis site to GitHub Pages

# Publishes the self-contained documentation site in site/ (built by
# site/build_site.py) to GitHub Pages. To activate once: repository
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true            # videos (*.mp4/*.gif) are Git LFS; fetch real bytes so Pages serves them, not pointers

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Fallback: Also copy site/ to docs/ and push to main branch
      # This ensures compatibility if GitHub Pages is configured to use "Branch: main / /docs"
      - name: Copy site to docs for fallback deployment
        run: |
          rm -rf docs
          cp -r site docs
          # Ensure .nojekyll is present in docs
          touch docs/.nojekyll

      - name: Push docs to main (fallback for Branch: main /docs)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$(git diff --name-only)" != "" ] || [ "$(git diff --cached --name-only)" != "" ]; then
            git add docs
            git commit -m "Update docs/ from site/ (GitHub Pages fallback deployment)" || echo "Nothing to commit"
            git push origin main || echo "Push failed or nothing to push"
          else
            echo "No changes to commit"
          fi
