   <g id="text_1">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(116.291912 92.350481)">Observational sprint studies</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(105.553116 101.532687)">link pelvic motion with hamstring</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(112.895959 110.714894)">strain and running mechanics</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(316.195775 92.350481)">Unresolved: individual anatomy and</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(320.079884 101.532687)">co-varying whole-body kinematics</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(313.681322 110.714894)">confound the pelvis–load relationship</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(130.404875 170.17747)">THIS STUDY  —  one predictive musculoskeletal sprinter model</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(100.786609 179.807589)">constrain ONLY the touchdown pelvis tilt, then re-optimize the whole-body</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(113.394344 189.504895)">motion for maximum speed (speed held ~constant across conditions)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(105.981459 258.325138)">PRIMARY  (N=100)</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(85.540584 267.059432)">8 deterministic design points</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(86.029303 275.793726)">peak normalized fibre length</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(100.451991 284.528019)">lMtilde vs anterior tilt</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(142.2216 293.262313)"/>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(116.753991 301.996607)">→ Fig 2, Fig 3</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(258.105609 258.325138)">MECHANISM</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(235.525828 267.059432)">tree-rigid / femur-fixed /</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(235.223578 275.793726)">adaptive decomposition</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(231.606328 284.528019)">pelvis–femur coordination</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(282.168 293.262313)"/>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(268.419891 301.996607)">→ Fig 5</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(399.668681 258.325138)">EXTENSION</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(375.035306 267.059432)">speed vs load-surrogate</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(386.4294 275.793726)">Pareto exploration</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(381.809728 284.528019)">(3 warm-start paths)</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(422.1144 293.262313)"/>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(408.366291 301.996607)">→ Fig 7</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(111.988563 354.907956)">Baseline face validity: Nominal N=100 vs the subject's own experimental sprint  (→ Fig 4)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(162.037531 363.418294)">Numerical operability, solution selection &amp; sensitivity  (→ Fig 6)</text>
   </g>
   <g id="text_8">
    <text style="font-style: italic; font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #666666" x="282.168" y="393.315175" transform="rotate(-0 282.168 393.315175)">Interpretation stays at correlation / mechanism WITHIN one model — not injury causation, not population inference.</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="15.224297" transform="rotate(-0 7.2 15.224297)">Figure 1 | Research gap and validation chain</text>
  </g>
